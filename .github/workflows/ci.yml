name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-state: 'npm'
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          npx prisma generate

      - name: Next.js Build
        run: npm run build